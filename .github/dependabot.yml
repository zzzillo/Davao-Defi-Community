version: 2
updates:
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 10
