name: Dependency security audit

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "17 1 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Report dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low
        # Existing findings should be visible while separate remediation is
        # planned; don't make the staging or production branch unmergeable.
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Audit backend dependencies
        run: pip-audit --progress-spinner=off -r backend/requirements.txt
        # Report the full scan result in the job log without masking other CI
        # checks; remediation can then be reviewed and tested separately.
        continue-on-error: true
